[package]
name = "floorfield"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
eikonal = { path = "../eikonal" }
cxx = "1.0"
rayon = "1"
geo = "0.28"
num-traits = "0.2"
rstar = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cxx-build = "1.0"
